# Bitra Charge & Thermal Guard settings (read every loop; no reboot needed)
# Skin-temperature cool-down while charging (degrees C). Below SKIN_L4 = no limit (full speed).
SKIN_L4=45   # cool_down 4: VOOC <= 2.5 A, normal/QC <= 2.0 A
SKIN_L3=47   # cool_down 3: VOOC <= 2.0 A, normal/QC <= 2.0 A
SKIN_L2=49   # cool_down 2: VOOC <= 1.5 A, normal/QC <= 1.5 A
HYST=2       # relax a level only after skin drops this many degrees below its threshold
# Cooler charging: cap the big CPU cores while charging with the screen on and the battery
# at/above BOOST_BATT, so the battery stays under the 35/37 C VOOC speed steps. 0 = off.
BOOST=0
BOOST_BATT=33
BOOST_PRIME_KHZ=2400000
BOOST_GOLD_KHZ=1900000
# Restart the NXP NFC HAL if it spins (busy-loop bug fixed upstream 2026-10-04). 1 = on.
NFC_GUARD=1
